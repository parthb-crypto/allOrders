<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Orders Under Design - Sample Data View</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding: 20px;
      background: #f8f9fa;
    }

    h2 {
      margin-bottom: 20px;
      color: #0d6efd;
    }

    .table-container {
      margin-bottom: 40px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      overflow-x: auto;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      border: 1px solid #dee2e6;
      padding: 10px 15px;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      background-color: #e9ecef;
      color: #212529;
      font-weight: 600;
    }

    td {
      color: #495057;
    }

    .key-col {
      font-weight: 600;
      background: #f8f9fa;
      width: 25%;
    }

    .scrollable-table {
      overflow-x: auto;
    }

    .vertical-table {
      display: flex;
      flex-direction: row;
      overflow-x: auto;
    }

    .vertical-table table {
      min-width: unset;
      width: auto;
    }

    .vertical-table th {
      min-width: 150px;
      text-align: center;
    }

    .vertical-table td {
      min-width: 150px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <h2>OverView</h2>

    <!-- Job Details -->
    <div class="table-container">
      <h4 class="mb-3 text-primary">Job Details</h4>
      <div class="scrollable-table">
        <table id="jobTable" class="table table-bordered table-striped"></table>
      </div>
    </div>

    <!-- Product Details -->
    <div class="table-container">
      <h4 class="mb-3 text-success">Product Details</h4>
      <div class="vertical-table">
        <table id="productTable" class="table table-bordered table-striped"></table>
      </div>
    </div>

    <!-- Third Table (for future data or extension) -->
    <div class="table-container">
      <h4 class="mb-3 text-warning">Additional Details</h4>
      <div class="scrollable-table">
        <table id="extraTable" class="table table-bordered table-striped">
          <tr>
            <td>No extra data provided yet.</td>
          </tr>
        </table>
      </div>
    </div>
  </div>

    // ✅ Function to render key-value data as horizontal table
    function renderTable(data, tableId, isVertical = false) {
      const table = document.getElementById(tableId);
      if (!isVertical) {
        // Original horizontal table rendering
        let html = `<thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>`;
        Object.keys(data).forEach(key => {
          const value = data[key] ?? 'N/A';
          if (key.toLowerCase().includes("qr_code") && typeof value === "string" && value.startsWith("http")) {
            html += `<tr><td class='key-col'>${key}</td><td><img src="${value}" alt="QR Code" width="100"></td></tr>`;
          } else {
            html += `<tr><td class='key-col'>${key}</td><td>${value}</td></tr>`;
          }
        });
        html += `</tbody>`;
        table.innerHTML = html;
      } else {
        // Vertical table rendering
        let html = `<tr>`;
        // Header row (field names)
        Object.keys(data).forEach(key => {
          html += `<th>${key}</th>`;
        });
        html += `</tr><tr>`;
        // Value row
        Object.keys(data).forEach(key => {
          const value = data[key] ?? 'N/A';
          if (key.toLowerCase().includes("qr_code") && typeof value === "string" && value.startsWith("http")) {
            html += `<td><img src="${value}" alt="QR Code" width="100"></td>`;
          } else {
            html += `<td>${value}</td>`;
          }
        });
        html += `</tr>`;
        table.innerHTML = html;
      }
    }

    // ✅ Render all tables
    renderTable(jobData, 'jobTable', false);  // Keep job table horizontal
    renderTable(productData, 'productTable', true);  // Make product table vertical
